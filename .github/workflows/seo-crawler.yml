name: SEO Crawler

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to crawl"
        required: true
        default: "https://weeklypakistan.com.pk/"
      max_pages:
        description: "Maximum pages"
        required: true
        default: "10"

jobs:
  crawl:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'SEO CRAWL:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests
          python -m playwright install --with-deps chromium

      - name: Start crawler and run crawl
        env:
          TARGET_URL: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.inputs.url || 'https://weeklypakistan.com.pk/' }}
          MAX_PAGES: ${{ github.event_name == 'issues' && '10' || github.event.inputs.max_pages || '10' }}
        run: |
          TARGET_URL=$(printf '%s' "$TARGET_URL" | tr -d '\r\n' | xargs)
          echo "Target URL: $TARGET_URL"
          echo "Maximum pages: $MAX_PAGES"

          python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > crawler.log 2>&1 &
          SERVER_PID=$!

          echo "Uvicorn PID: $SERVER_PID"

          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/ > /dev/null; then
              echo "Crawler API is ready."
              break
            fi

            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Uvicorn stopped unexpectedly."
              cat crawler.log
              exit 1
            fi

            echo "Waiting for API... ($i/30)"
            sleep 1
          done

          if ! curl -fs http://127.0.0.1:8000/ > /dev/null; then
            echo "API failed to start."
            cat crawler.log
            exit 1
          fi

          echo "Starting crawl of $TARGET_URL with max pages $MAX_PAGES..."

          python -c "import os,requests; r=requests.post('http://127.0.0.1:8000/crawl',json={'url':os.environ['TARGET_URL'],'max_pages':int(os.environ['MAX_PAGES'])}); print(r.text); open('crawl_response.txt','w').write(r.text); r.raise_for_status()"

          CRAWL_ID=$(python -c "import json; print(json.load(open('crawl_response.txt'))['crawl_id'])")

          echo "Crawl ID: $CRAWL_ID"

          for i in {1..120}; do
            STATUS=$(python -c "import requests; print(requests.get('http://127.0.0.1:8000/crawl/$CRAWL_ID').json().get('status','unknown'))")

            echo "Crawl status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Crawl completed successfully."
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "Crawl failed."
              cat crawler.log
              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "completed" ]; then
            echo "Crawl timed out."
            cat crawler.log
            exit 1
          fi

      - name: Show crawler log
        if: always()
        run: |
          echo "========== CRAWLER LOG =========="
          cat crawler.log || true

      - name: Upload crawl results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-crawl-results
          path: |
            data/
            results/
            crawl_response.txt
            crawler.log
          if-no-files-found: warn
