name: Google Integrations

on:
  push:
    branches: [google-seo-integrations]
  pull_request:
    branches: [google-seo-integrations]
  workflow_dispatch:

jobs:
  test-google-integrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application
        run: python -m compileall -q app tests

      - name: Run Google integration unit tests
        run: pytest -q tests/test_google_integrations.py
